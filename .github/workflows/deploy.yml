# Deploy to AWS from GitHub via OIDC (no long-lived AWS keys).
#
# To deploy on every push to main, add under `on:`:
#   push:
#     branches: [main]
name: Deploy

on:
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # Required for GitHub "Environment" variables/secrets (e.g. AWS_GITHUB_OIDC_ROLE_ARN).
    # Create an Environment with this exact name under Settings → Environments, or change the name below.
    # Repository-level Variables (no environment) work without this line.
    environment: production
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_OIDC_ROLE_ARN }}
          role-session-name: github-actions-sam-deploy
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: SAM build
        run: sam build --use-container

      - name: SAM deploy
        env:
          # Required template parameters (no Defaults in template.yaml). Values default to README
          # examples; set repo Variables to override per account.
          NEWS_API_SECRET_ID: ${{ vars.NEWS_API_SECRET_ID || 'trading/newsapi' }}
          ANTHROPIC_API_SECRET_ID: ${{ vars.ANTHROPIC_API_SECRET_ID || 'trading/anthropic' }}
          ALPACA_API_KEY_SECRET_ID: ${{ vars.ALPACA_API_KEY_SECRET_ID || 'trading/alpaca-api-key' }}
          ALPACA_SECRET_KEY_SECRET_ID: ${{ vars.ALPACA_SECRET_KEY_SECRET_ID || 'trading/alpaca-secret-key' }}
          BACKTEST_LAKE_BUCKET: ${{ vars.BACKTEST_LAKE_BUCKET_NAME || 'trading-backtest-lake-365953917399-us-east-1' }}
          # Must be passed explicitly or CloudFormation keeps the previous stack value (e.g. retired -latest ids).
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-haiku-4-5-20251001' }}
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              "NewsApiSecretId=${NEWS_API_SECRET_ID}" \
              "AnthropicApiSecretId=${ANTHROPIC_API_SECRET_ID}" \
              "AlpacaApiKeySecretId=${ALPACA_API_KEY_SECRET_ID}" \
              "AlpacaSecretKeySecretId=${ALPACA_SECRET_KEY_SECRET_ID}" \
              "BacktestLakeBucketName=${BACKTEST_LAKE_BUCKET}" \
              "AnthropicModel=${ANTHROPIC_MODEL}"
