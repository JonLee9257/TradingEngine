version = 0.1

# Deploy metadata only. Stack parameters use defaults from template.yaml unless you
# pass --parameter-overrides on the CLI, or override from GitHub Actions (deploy.yml).
# Duplicating thresholds/model/symbols here drifted from template defaults in the past.

[default.deploy.parameters]
stack_name = "trading-system-paper"
resolve_s3 = true
s3_prefix = "trading-system-paper"
region = "us-east-1"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
disable_rollback = true
image_repositories = []

[default.global.parameters]
region = "us-east-1"
